simulation:
  gravity: [0, 0, -10]
  time_step: 0.004166666666666667  # 1/240
  solver_iterations: 10
  use_maximal_coordinates: true
  settle_steps: 80
  post_move_steps: 6000

plane:
  urdf: "plane100.urdf"
  lateral_friction: 2.0

cube:
  mesh_file: "cube.obj"
  visual_rgba: [1, 1, 1, 1]
  visual_specular: [0.4, 0.4, 0]
  frame_shift: [0, -0.02, 0]
  cube_scale: [1, 1, 1]
  mass: 1.0
  lateral_friction: 0.8

robot:
  mesh_file: "cube.obj"
  visual_rgba: [0.8, 0.2, 0.2, 1]
  visual_specular: [0.4, 0.4, 0]
  frame_shift: [0, 0, 0]
  robot_scale: [1, 1, 0.4]
  mass: 5.0
  lateral_friction: 1.0

stack:
  count: 3
  base_position: [0, 0, 1]
  z_spacing: 4

motion:
  x_offset: 1.5
  move_steps: 480

visualizer:
  disable_during_setup:
    rendering: true
    gui: true
    tiny_renderer: true
